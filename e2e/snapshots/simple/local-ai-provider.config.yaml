port: 8080
default_response: "I am a local AI provider default response."
selection_strategy: "sequential"

models:
  - id: "gpt-4o"
    owned_by: "openai"
    created: 1715367049
  - id: "gpt-4o-mini"
    owned_by: "openai"
    created: 1721172741
  - id: "gemini-1.5-pro"
    owned_by: "google"
    created: 1715000000

matchers:
  - id: "weather-tool-trigger"
    priority: 100
    match:
      model: "gpt-4o"
      message_contains: "weather in San Francisco"
      has_tools: true
      has_tool_output: false
    response:
      tool_calls:
        - id: "call_weather_1"
          name: "get_weather"
          arguments: '{"location":"San Francisco, CA","unit":"celsius"}'

  - id: "weather-tool-followup"
    priority: 110
    match:
      model: "gpt-4o"
      has_tool_output: true
      tool_output_contains: "18"
    response:
      text: "The current weather in San Francisco is 18°C and sunny."

  - id: "vertex-weather-trigger"
    priority: 100
    match:
      api_type: "vertex"
      message_contains: "weather in San Francisco"
      has_tools: true
      has_tool_output: false
    response:
      tool_calls:
        - id: "call_weather_1"
          name: "get_weather"
          arguments: '{"location":"San Francisco, CA","unit":"celsius"}'

  - id: "vertex-weather-followup"
    priority: 110
    match:
      api_type: "vertex"
      has_tool_output: true
      tool_output_contains: "18"
    response:
      text: "The current weather in San Francisco is 18°C and sunny."

  - id: "greeting-rule"
    priority: 50
    match:
      message_regex: "(?i)^(hello|hi|hey)\\b"
    response:
      selection_strategy: "sequential"
      responses:
        - "Hello! How can I assist you today?"
        - "Hi there! What can I help you build?"

  - id: "reasoning-rule"
    priority: 60
    match:
      message_contains: "solve step by step"
    response:
      reasoning_content: "Step 1: Analyze the problem. Step 2: Compute result."
      text: "The final answer is 42."
